spack:
  specs:
    # Packages required for a *truly minimal* build
    - cli11
    - cmake
    - nlohmann-json
    # ... plus packages required for *basic* realistic development
    - "geant4@11"
    - git
    - "googletest@1.10:"
    - py-pre-commit
    - "python@3.6:"
    # ... plus *recommended* options
    - "covfie@0.13:"
    - "g4vg@1.0.3:"
    - hepmc3
    - libpng
    - ninja
    - "root@6.28:"
    - "vecgeom@1.2.10:1 +gdml"
    # ... plus additional documentation tools
    - doxygen
    - git-lfs
    - py-breathe
    - py-furo
    - py-sphinx
    - py-sphinxcontrib-bibtex
    - py-sphinxcontrib-mermaid
    # ... plus experimental libraries
    - mpi
  view: true
  concretizer:
    unify: true
  packages:
    root:
      # Note: ~gsl and ~math are removed because dd4hep requires them
      variants: ~aqua ~davix ~examples ~opengl ~x ~tbb
    all:
      # Note: C++17 is the minimum required
      # Note: for CUDA support run this command in your environment:
      # spack config add packages:all:variants:"cxxstd=17 +cuda cuda_arch=<ARCH>"
      variants: cxxstd=20
