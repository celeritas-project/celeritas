# Note that Geant4, vecgom, and ROOT are added by the CI script.
# Most of these specs should correspond to 
# https://github.com/celeritas-project/spack-gha-buildcache/blob/main/spack.yaml
spack:
  view: /opt/spack-view
  specs:
  - ccache
  - cmake
  - googletest
  - hepmc3
  - libpng
  - ninja
  - nlohmann-json
  config:
    install_tree:
      root: /opt/spack
      projections:
        all: "{name}/{version}/{hash:7}"
  mirrors:
    celer-buildcache:
      url: oci://ghcr.io/celeritas-project/spack-gha-buildcache
      signed: false
  packages:
    root:
      variants: ~aqua ~davix ~examples ~opengl ~x ~tbb cxxstd=20
    all:
      variants: cxxstd=20
      require:
      - '%clang@18'
      - any_of: [+ipo, '@:']
      - any_of: [build_system=cmake, '@:']
      - any_of: [build_type=Release, '@:']
      - any_of: [generator=ninja, '@:']
