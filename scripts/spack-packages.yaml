# These encode version and variant requirements for packages used by Celeritas.
# Update this file when modifying the top-level CMakeLists.txt.
# Do not try to install this as an environment: instead, use:
# - minimal dev install at scripts/dev/spack-basic.yaml
# - full dev install at scripts/dev/spack-full.yaml
packages:
  all:
    require:
    - any_of: [generator=ninja build_system=cmake, '@:']
    - any_of: [build_type=Release, '@:']
    - any_of: [cxxstd=20, '@:']
    prefer:
    - "generator=ninja build_system=cmake"
    - "build_type=Release"
    - "cxxstd=20"
    # Note: for CUDA support run this command in your environment:
    # spack config add packages:all:prefer:"+cuda cuda_arch=<ARCH>"
  cli11:
    require: '@2.4:'
  cmake:
    require: '@3.18:'
  nlohmann-json:
    require: '@3.7.0:'
  geant4:
    require: '@10.5:'
  googletest:
    require: '@1.10:'
  py-identify: # needed by py-pre-commit
    require: '@2.6:'
  python:
    require: '@3.9:'
  covfie:
    require: '@0.13:'
  g4vg:
    require: '@1.0.3:'
  vecgeom:
    require:
    - '@1.2.10:'
    - +gdml
  root:
    require:
    - '@6.28:'
    variants:
    # Prefer building without GUI and with ROOT 7 support if available
    - ~aqua ~davix ~examples ~opengl ~x ~tbb ~webgui +root7
  dd4hep:
    require:
    - '@1.18:'
    - ~utilityapps ~ddeve
