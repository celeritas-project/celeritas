#-----------------------------------------------------------------------------#
# Spack environment for the ROCm docker image: see scripts/docker/build.sh.
# The included files are copied from scripts/spack, except ext-gpu.yaml which
# is written by write-gpu-externals.sh.
#
# Dependencies are built with the system GCC: only Celeritas itself is built
# with the ROCm clang (see scripts/cmake-presets/ci-ubuntu-rocm.json). The
# rocrand/rocthrust/hipcub libraries come from the base image in /opt/rocm.
# VecGeom does not support HIP.
#-----------------------------------------------------------------------------#

spack:
  include:
    - reqs-celer.yaml
    - prefs-hep-nogui.yaml
    - ext-ubuntu24.yaml
    - ext-gpu.yaml

  specs:
    - cli11
    - cmake
    - covfie
    - "geant4@11.3"
    - googletest
    - "hepmc3 ~rootio"
    - libpng
    - ninja
    - nlohmann-json
    - openmpi

  concretizer:
    unify: true
    targets:
      granularity: generic
      host_compatible: true

  packages:
    all:
      prefer:
        - "cxxstd=17"
    c:
      require: gcc
    cxx:
      require: gcc
    fortran:
      require: gcc
    # Keep in sync with the HIP architecture of scripts/cmake-presets/ci-ubuntu-rocm.json
    covfie:
      require:
        - "+rocm amdgpu_target=gfx90a"
      variants:
        - generator=ninja
    geant4:
      variants:
        - generator=ninja

  config:
    install_tree:
      root: /opt/software
  view: /opt/view
