spack:
  include:
  - ../spack-packages.yaml
  specs:
  # Packages required for a *truly minimal* build
  - cli11
  - cmake
  - nlohmann-json
  # ... plus packages required for *basic* realistic development
  - geant4@11.3
  - git
  - googletest
  - py-pre-commit
  - python
  # ... plus *recommended* options
  - covfie
  - g4vg
  - hepmc3
  - ninja
  - vecgeom@1
  view: true
  concretizer:
    unify: true
