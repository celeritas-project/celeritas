#-----------------------------------------------------------------------------#
# Spack environment for the CUDA docker image: see scripts/docker/README.md.
# ext-gpu.yaml is written in the image by scripts/docker/gpu/write-gpu-externals.sh.
#-----------------------------------------------------------------------------#

spack:
  include:
    - reqs-celer.yaml
    - reqs-docker.yaml
    - prefs-build.yaml
    - prefs-hep-nogui.yaml
    - ext-ubuntu24.yaml
    - ext-gpu.yaml

  specs:
    - ccache
    - cli11
    - cmake
    - covfie
    - cub
    - g4vg
    - "geant4@11.3"
    - googletest
    - hepmc3
    - libpng
    - ninja
    - nlohmann-json
    - openmpi
    - py-gcovr # coverage reports in build-codecov
    - root
    - thrust
    - "vecgeom@2.2:"

  packages:
    all:
      prefer:
        - "cxxstd=20"
    # Keep in sync with the CUDA architecture of scripts/cmake-presets/ci-ubuntu-cuda.json
    covfie:
      require:
        - "+cuda cuda_arch=80"
    vecgeom:
      require:
        - "+cuda cuda_arch=80"
