toolchains:
  clang_toolchain:
    - spec: "%c=llvm@22"
      when: "%c"
    - spec: "%cxx=llvm@22"
      when: "%cxx"
    - spec: "%fortran=gcc@15"
      when: "%fortran"
  gcc_toolchain:
    - spec: "%c=gcc@15"
      when: "%c"
    - spec: "%cxx=gcc@15"
      when: "%cxx"
    - spec: "%fortran=gcc@15"
      when: "%fortran"

packages:
  all:
    target: [x86_64_v3]
    require:
      - "target=x86_64_v3"
  bash:
    buildable: false
    externals:
      - spec: bash@5.3.9
        prefix: /usr
  gcc:
    buildable: false
    externals:
      - spec: gcc@15.2.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc-15
            cxx: /usr/bin/g++-15
            fortran: /usr/bin/gfortran-15
  llvm:
    buildable: false
    externals:
      - spec: llvm@22.1.2+clang~flang~lld~lldb
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/clang-22
            cxx: /usr/bin/clang++-22
  m4:
    buildable: false
    externals:
      - spec: m4@1.4.21
        prefix: /usr
  perl:
    buildable: false
    externals:
      - spec: perl@5.40.1~cpanm+opcode+open+shared+threads
        prefix: /usr
  autoconf:
    buildable: false
    externals:
      - spec: autoconf@2.72
        prefix: /usr
  git:
    buildable: false
    externals:
      - spec: git@2.55.0~tcltk
        prefix: /usr
  gmake:
    buildable: false
    externals:
      - spec: gmake@4.4.1
        prefix: /usr
