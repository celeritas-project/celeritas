packages:
  all:
    target: [x86_64_v3]
    require:
      - "target=x86_64_v3"
  bash:
    buildable: false
    externals:
      - spec: bash@5.3.9
        prefix: /usr
  gcc:
    buildable: false
    externals:
      - spec: gcc@15.2.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc-15
            cxx: /usr/bin/g++-15
            fortran: /usr/bin/gfortran-15
  llvm:
    externals:
      - spec: llvm@22.1.2+clang~flang~lld~lldb
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/clang-22
            cxx: /usr/bin/clang++-22
    buildable: false
  m4:
    externals:
      - spec: m4@1.4.21
        prefix: /usr
    buildable: false
  perl:
    externals:
      - spec: perl@5.40.1~cpanm+opcode+open+shared+threads
        prefix: /usr
    buildable: false
  autoconf:
    externals:
      - spec: autoconf@2.72
        prefix: /usr
    buildable: false
  git:
    externals:
      - spec: git@2.53.0~tcltk
        prefix: /usr
    buildable: false
  gmake:
    externals:
      - spec: gmake@4.4.1
        prefix: /usr
    buildable: false
