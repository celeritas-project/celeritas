#-----------------------------------------------------------------------------#
# Spack environment for the ROCm docker image: see scripts/docker/README.md.
# ext-gpu.yaml is written in the image by scripts/docker/gpu/write-gpu-externals.sh.
#
# Only Celeritas itself is built with the ROCm clang (see
# scripts/cmake-presets/ci-ubuntu-rocm.json). The ROCm libraries are
# externals from the base image in /opt/rocm. VecGeom does not support HIP.
#-----------------------------------------------------------------------------#

spack:
  include:
    - reqs-celer.yaml
    - reqs-docker.yaml
    - prefs-build.yaml
    - prefs-hep-nogui.yaml
    - ext-ubuntu24.yaml
    - ext-gpu.yaml

  specs:
    - ccache
    - cli11
    - cmake
    - covfie
    - "geant4@11.3"
    - googletest
    - "hepmc3 ~rootio"
    - hipcub
    - hiprand
    - libpng
    - ninja
    - nlohmann-json
    - openmpi
    - rocprim
    - rocrand
    - rocthrust

  packages:
    all:
      prefer:
        - "cxxstd=17"
    # Keep in sync with the HIP architecture of scripts/cmake-presets/ci-ubuntu-rocm.json
    covfie:
      require:
        - "+rocm amdgpu_target=gfx90a"
