packages:
  all:
    prefer:
      - "cxxstd=20"
  cli11:
    require: "@2.4:"
  cmake:
    require: "@3.21:"
  covfie:
    require: "@0.13:"
  dd4hep:
    require:
      - "@1.33:"
    variants:
      - ~utilityapps ~ddeve
  g4vg:
    require: "@1.0.3:"
  geant4:
    require: "@10.5:"
    version:
      - "11.3"
  googletest:
    require: "@1.10:"
  llvm: # for lldb-dap compatibility
    variants:
      - +python
    version:
      - "20:"
  nlohmann-json:
    require: "@3.7.0:"
  py-identify: # needed by py-pre-commit
    require: "@2.6:"
  python:
    require: "@3.9:"
  root:
    require:
      - "@6.28:"
    variants:
      # These are "default starting values", not required
      # using it rather than `prefer` prevents `all:prefer:` from being overwritten
      - ~aqua ~davix ~examples ~opengl ~x ~tbb ~webgui +root7
  vecgeom:
    require:
      - "@1.2.10:"
      - +gdml
    version:
      - "1"
