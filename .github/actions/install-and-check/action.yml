#-----------------------------------------------------------------------------#
# Install Celeritas from an existing build directory and sanity-check the result.
#-----------------------------------------------------------------------------#

name: 'Install and check Celeritas'
description: 'cmake --install, optionally clean the build, and check the installed binaries'
inputs:
  binaries:
    description: 'Space-separated list of bin/ executables to check for'
    required: false
    default: 'celer-sim'
  check-config:
    description: "Run 'celer-sim --config' after install"
    required: false
    default: 'true'
  check-version:
    description: "Run 'celer-sim --version' after install"
    required: false
    default: 'false'
  clean-build:
    description: 'Clean the build directory after installing'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Install
      id: install
      shell: bash
      working-directory: build
      run: |
        echo "::group::Install"
        cmake --install .
        echo "::endgroup::"
    - name: Clean build
      if: ${{inputs.clean-build == 'true'}}
      shell: bash
      working-directory: build
      run: cmake --build . --target clean
    - name: Check installation
      shell: bash
      working-directory: install
      run: |
        for exe in ${{inputs.binaries}}; do
          test -x "bin/${exe}"
        done
        if [ "${{inputs.check-version}}" = "true" ]; then
          ./bin/celer-sim --version
        fi
        if [ "${{inputs.check-config}}" = "true" ]; then
          ./bin/celer-sim --config
        fi
