#-----------------------------------------------------------------------------#
# Run ctest and upload the JUnit test results as an artifact.
#-----------------------------------------------------------------------------#

name: 'Run ctest'
description: 'Run ctest with a preset and upload test-output as an artifact'
inputs:
  preset:
    description: 'ctest preset name'
    required: true
  artifact-name:
    description: 'Name for the uploaded test-results artifact'
    required: true
  extra-args:
    description: 'Additional arguments to pass to ctest'
    required: false
    default: ''
outputs:
  outcome:
    description: "Outcome of the ctest step ('success' or 'failure')"
    value: ${{steps.test.outcome}}

runs:
  using: 'composite'
  steps:
    - name: Run ctest
      id: test
      shell: bash
      run: ctest --preset=${{inputs.preset}} ${{inputs.extra-args}}
    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: >-
        ${{
          always()
          && (steps.test.outcome == 'success'
              || steps.test.outcome == 'failure')
        }}
      with:
        name: ${{inputs.artifact-name}}
        path: "test-output/**/*.xml"
        if-no-files-found: error
        retention-days: 1
