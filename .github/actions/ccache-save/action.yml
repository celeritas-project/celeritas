#-----------------------------------------------------------------------------#
# Save a ccache directory after the build step, only if the build succeeded.
#
# Pair with the 'ccache-restore' action, called *before* the build step.
#-----------------------------------------------------------------------------#

name: 'Save ccache directory'
description: 'Save a ccache directory to the GitHub Actions cache, gated on build success'
inputs:
  path:
    description: 'ccache directory to save'
    required: true
  key:
    description: 'Unique cache key for this run (should include github.run_id)'
    required: true
  build-outcome:
    description: >-
      Outcome of the caller's build step (e.g. ${{steps.build.outcome}}); the cache
      is only saved when this is 'success'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Save ccache
      if: ${{always() && inputs.build-outcome == 'success'}}
      uses: actions/cache/save@v5
      with:
        path: ${{inputs.path}}
        key: ${{inputs.key}}
