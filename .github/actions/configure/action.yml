#-----------------------------------------------------------------------------#
# Point CMakeUserPresets.json at a CI presets file and configure Celeritas.
# Assumes all cmake preset files set binaryDir="${sourceDir}/build"
#-----------------------------------------------------------------------------#

name: "Configure Celeritas"
description: "Symlink/copy the CI CMakeUserPresets.json and run cmake --preset"
inputs:
  preset:
    description: "CMake preset name"
    required: true
  presets-file:
    description: "Filename under scripts/cmake-presets/ to use as CMakeUserPresets.json"
    required: true
  version-string:
    description: "Value for -DCeleritas_VERSION_STRING"
    required: false
    default: ""
  args:
    description: "Additional arguments to pass to cmake"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Copy CMakeUserPresets.json
      shell: bash
      run: cp "scripts/cmake-presets/${{inputs.presets-file}}" CMakeUserPresets.json
    - name: Set reproducible source date
      shell: bash
      run: |
        REF=${{ github.sha }}
        SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct ${REF})
        echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"
        echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" >> $GITHUB_ENV
    - name: Construct version string
      id: git-description
      if: ${{!inputs.version-string}}
      env:
        PR_NUMBER: ${{ github.event.pull_request.number || "" }}
      shell: bash
      run: |
        REF=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${GITHUB_REF#refs/}" --jq '.ref' 2>/dev/null || true)
        if [[ "$REF" == refs/tags/* ]]; then
          VERSION_STRING=${REF#refs/tags/}
        elif [[ -n "$PR_NUMBER" ]]; then
          CELER_VERSION="-pr.$PR_NUMBER"
        else
          COMMIT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.sha')
          VERSION_STRING=+${COMMIT:0:7}
        fi
        echo "VERSION_STRING=${VERSION_STRING}" >> "$GITHUB_OUTPUT"
    - name: Configure Celeritas
      id: configure
      shell: bash
      env:
        CMAKE_PRESET: ${{inputs.preset}}
        VERSION_STRING: >-
          ${{ inputs.version-string
              || steps.git-description.outputs.VERSION_STRING
          }}
      run: |
        cmake --preset="$CMAKE_PRESET" --log-level=VERBOSE \
          ${{inputs.args}} \
          -DCeleritas_VERSION_STRING="$VERSION_STRING"
    - name: Print debug diagnostics on failure
      if: ${{ failure() || runner.debug }}
      shell: bash
      run: |
        which -a cmake
        cmake --version
        cmake --list-presets
        echo "CELER_JOB_NAME=$CELER_JOB_NAME"
    - name: Upload CMakeCache.txt on configure failure
      if: ${{ (failure() || runner.debug) && steps.configure.outcome != 'skipped' }}
      uses: actions/upload-artifact@v7
      with:
        name: CMakeCache.txt-${{env.CELER_JOB_NAME}}
        path: build/CMakeCache.txt
        if-no-files-found: error
