#-----------------------------------------------------------------------------#
# Label new issues from the answers in the issue form (logic and config schema in
# `label-submission.yml`).
# See @../ISSUE_TEMPLATE/
#
# - `ai-generated`: PR description contains the robot emoji, or all commits have
#   an `Assisted-by` trailer; also set by issue form "Generated by AI".
# - `ai-assisted`: only some commits have `Assisted-by`; also set by issue form
#   "Assisted by AI". Agents add this to their PRs.
# - Issue types (Bug, Enhancement, Task) and `external` come from the forms, or from
#   body commands `@github-actions type <type>` / `label <label>` (API issues).
# - A label already added by the submitter is respected.
#
#-----------------------------------------------------------------------------#

name: issues_opened
run-name: >-
  #${{github.event.issue.number}}: ${{github.event.issue.title}}

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  label-issue:
    name: "Add issue labels"
    # Keep the allow-lists in sync with the agent skills in .claude/skills/
    permissions:
      issues: write
    uses: ./.github/workflows/label-submission.yml
    with:
      config: |
        {
          "types": {"enhancement": "Enhancement", "bug": "Bug", "task": "Task"},
          "labels": ["physics", "geometry", "field", "app", "external", "scoring"],
          "authorship": {
            "heading": "Authorship",
            "labels": {"Assisted by AI": "ai-assisted", "Generated by AI": "ai-generated"}
          },
          "fence": {"Celeritas configuration": "json"},
          "hide_headings": ["Description"]
        }
