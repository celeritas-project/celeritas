#-----------------------------------------------------------------------------#
# Label new issues from the answers in the issue form.
# See @../ISSUE_TEMPLATE/issue.yml
# See @../ISSUE_TEMPLATE/issue.yml
#
# - `ai-generated`: PR description contains the robot emoji, or all commits have
#   an `Assisted-by` trailer; also set by issue form "Generated by AI".
# - `ai-assisted`: only some commits have `Assisted-by`; also set by issue form
#   "Assisted by AI". Agents add this to their PRs.
# - `bug`, `enhancement` ("Feature request" in the form), `external`
#   (experiment integration issues).
# - A label already added by the submitter is respected.
#
#-----------------------------------------------------------------------------#

name: issues_opened
run-name: >-
  #${{github.event.issue.number}}: ${{github.event.issue.title}}

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label-issue:
    name: "Add issue labels"
    runs-on: ubuntu-24.04
    steps:
      - name: Label issue from form answers
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            // Issue forms render each answer under a "### Label" heading
            const answer = (heading) => {
              const re = new RegExp(`^### ${heading}\\s*\\n+([^\\n]*)`, 'm');
              const m = body.match(re);
              return m ? m[1].trim() : '';
            };

            // The "external" label is applied by the integration form itself
            const kinds = {
              'Bug': 'Bug',
              'Feature request': 'Enhancement',
            };
            const authorship = {
              'Assisted by AI': 'ai-assisted',
              'Generated by AI': 'ai-generated',
            };
            const labels = [
              kinds[answer('Issue type')],
              authorship[answer('Authorship')],
            ].filter(Boolean);

            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
            };
            if (labels.length > 0) {
              core.info(`Adding labels: ${labels.join(', ')}`);
              await github.rest.issues.addLabels({...params, labels});
            } else {
              core.info('No labels to add');
            }

            // Always remove form metadata sections and the description
            // heading; keep the authorship as a hidden comment
            let cleaned = body
              .replace(/^### (Issue type|Authorship)\s*\n+[^\n]*\n*/gm, '')
              .replace(/^### Description\s*\n+/m, '')
              .trim();
            const author = answer('Authorship');
            if (author) {
              cleaned = `<!-- Authorship: ${author} -->\n${cleaned}`;
            }
            if (cleaned !== body) {
              await github.rest.issues.update({...params, body: cleaned});
            }
