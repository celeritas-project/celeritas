# Copyright Celeritas contributors: see top-level COPYRIGHT file for details
# SPDX-License-Identifier: (Apache-2.0 OR MIT)
#-----------------------------------------------------------------------------#
# Label new issues from the answers in the issue form.
# See @../ISSUE_TEMPLATE/
#
# - `ai-generated`: PR description contains the robot emoji, or all commits have
#   an `Assisted-by` trailer; also set by issue form "Generated by AI".
# - `ai-assisted`: only some commits have `Assisted-by`; also set by issue form
#   "Assisted by AI". Agents add this to their PRs.
# - Issue types (Bug, Feature, Task) and `external` come from the forms, or from
#   body commands `@github-actions task <type>` / `label <label>` (API issues).
# - A label already added by the submitter is respected.
#
#-----------------------------------------------------------------------------#

name: issues_opened
run-name: >-
  #${{github.event.issue.number}}: ${{github.event.issue.title}}

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label-issue:
    name: "Add issue labels"
    runs-on: ubuntu-24.04
    steps:
      - name: Label issue from form answers
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            // Issue forms render each answer under a "### Label" heading
            const answer = (heading) => {
              const re = new RegExp(`^### ${heading}\\s*\\n+([^\\n]*)`, 'm');
              const m = body.match(re);
              return m ? m[1].trim() : '';
            };

            // Commands in the issue body (for issues filed through the API):
            //   @github-actions task <enhancement|bug|task>
            //   @github-actions label <label>
            // Keep these lists in sync with .claude/skills/file-issue/SKILL.md
            const kinds = {
              enhancement: 'Feature',
              bug: 'Bug',
              task: 'Task',
            };
            const allowedLabels = [
              'physics', 'geometry', 'field', 'app', 'external', 'scoring',
            ];
            const authorship = {
              'Assisted by AI': 'ai-assisted',
              'Generated by AI': 'ai-generated',
            };

            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
            };
            const labels = [authorship[answer('Authorship')]].filter(Boolean);
            let type;
            const errors = [];

            // Process commands, leaving each valid one as an HTML comment
            let cleaned = body.replace(
              /^@github-actions[ \t]+(\w+)[ \t]+(\S+)[ \t]*$/gim,
              (line, cmd, arg) => {
                cmd = cmd.toLowerCase();
                arg = arg.toLowerCase();
                if (cmd === 'task' && arg in kinds) {
                  type = kinds[arg];
                } else if (cmd === 'label' && allowedLabels.includes(arg)) {
                  labels.push(arg);
                } else {
                  errors.push(line.trim());
                  return line;
                }
                return `<!-- processed: ${cmd} ${arg} -->`;
              });

            // Always wrap the celer-config output in a json code block
            cleaned = cleaned.replace(
              /^### Celeritas configuration[ \t]*\n+([\s\S]*?)(?=^### |^<!-- |(?![\s\S]))/m,
              (m, content) => {
                const inner = content
                  .replace(/^\s*```[a-z]*[ \t]*\n/i, '')
                  .replace(/\n?```[ \t]*\s*$/, '')
                  .trim();
                return `### Celeritas configuration\n\n\`\`\`json\n${inner}\n\`\`\`\n\n`;
              });

            // Replace form metadata with a hidden comment; drop the
            // description heading
            const author = answer('Authorship');
            cleaned = cleaned
              .replace(/^### Authorship\s*\n+[^\n]*\n*/gm, '')
              .replace(/^### Description\s*\n+/m, '')
              .trim();
            if (author) {
              cleaned = `<!-- Authorship: ${author} -->\n${cleaned}`;
            }

            if (labels.length > 0) {
              core.info(`Adding labels: ${labels.join(', ')}`);
              await github.rest.issues.addLabels({...params, labels});
            }
            const update = {};
            if (type) {
              core.info(`Setting type: ${type}`);
              update.type = type;
            }
            if (cleaned !== body) {
              update.body = cleaned;
            }
            if (Object.keys(update).length > 0) {
              await github.rest.issues.update({...params, ...update});
            }
            if (errors.length > 0) {
              await github.rest.issues.createComment({
                ...params,
                body: 'Unrecognized commands:\n\n'
                  + errors.map((e) => `- \`${e}\``).join('\n')
                  + '\n\nSupported: `task` ('
                  + Object.keys(kinds).join(', ') + '), `label` ('
                  + allowedLabels.join(', ') + ').',
              });
            }
