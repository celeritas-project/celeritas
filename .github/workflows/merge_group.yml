#-----------------------------------------------------------------------------#
# Launched when added to a merge queue
#-----------------------------------------------------------------------------#

name: merge_group
# Run name renders as `refs/heads/gh-readonly-queue/develop/pr-1-5c5a8f0a74fcd3c4bf682dc2f7b827f0b0344405`
run-name: ${{github.event.merge_group.head_ref}}

on:
  merge_group: {}

concurrency:
  group: merge-${{github.event.merge_group.head_ref}}
  cancel-in-progress: true

permissions:
  actions: write # for clearing cache

jobs:
  build-docs:
    uses: ./.github/workflows/build-docs.yml
  build-fast:
    uses: ./.github/workflows/build-fast.yml
  build-ultralite:
    uses: ./.github/workflows/build-ultralite.yml

  build-fast-extra:
    uses: ./.github/workflows/build-fast-extra.yml
  build-spack:
    uses: ./.github/workflows/build-spack.yml
  build-spack-extra:
    uses: ./.github/workflows/build-spack-extra.yml

  build-codecov:
    uses: ./.github/workflows/build-codecov.yml
  build-docker:
    uses: ./.github/workflows/build-docker.yml
  build-regression:
    uses: ./.github/workflows/build-regression.yml

  all:
    if: ${{ always() }}
    needs:
      # IMPORTANT: should be the same as `jobs:all:needs` in `pull_request.yml`
      - build-fast
      - build-ultralite
      - build-docs
      - build-fast-extra
      - build-spack
      - build-spack-extra
      - build-codecov
      - build-docker
      - build-regression
    runs-on: ubuntu-26.04
    steps:
      - name: Check failures
        id: check
        uses: actions/github-script@v9
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            core.debug(`needs: ${JSON.stringify(needs)}`);

            const unsuccessful = Object.entries(needs)
              .filter(([, job]) => job.result !== 'success')
              .map(([name]) => name);

            core.setOutput('unsuccessful', unsuccessful.join(','));
            if (unsuccessful.length) {
              core.setFailed(`Jobs did not succeed: ${unsuccessful.join(', ')}`);
            }

  # On success, delete branch-specific caches
  process-pr-number:
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.extract.outputs.number }}
    steps:
      - name: Extract PR number
        id: extract
        uses: actions/github-script@v9
        env:
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        with:
          script: |
            // branch name format: gh-readonly-queue/{base_branch}/pr-{pr_number}-{head_sha}
            const match = process.env.HEAD_REF.match(/\/pr-(\d+)-/);
            if (!match) {
              core.setFailed(`Could not extract PR number from ${process.env.HEAD_REF}`);
              return;
            }
            core.setOutput('number', match[1]);

  clear-branch-cache:
    uses: ./.github/workflows/clear-cache.yml
    needs: ["all", "process-pr-number"]
    if: ${{ needs.all.result == 'success' && needs.process-pr-number.result == 'success' }}
    with:
      key: ".*"
      ref: "(refs/pull/|gh-readonly-queue/.*/pr-)${{ needs.process-pr-number.outputs.number }}"

