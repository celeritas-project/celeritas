#-----------------------------------------------------------------------------#
# Build using CUDA/ROCm docker images
#-----------------------------------------------------------------------------#

name: build-docker
on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: build-docker-${{github.event.number || github.ref_name}}
  cancel-in-progress: true

jobs:
  # TODO: since we don't build on GPU systems with cuda/rocm docker,
  # none of the tests actually run on device
  gpu:
    name: docker
    runs-on: ubuntu-24.04
    steps:
      - name: Sleep 2 minutes
        run: |
          sleep 120

