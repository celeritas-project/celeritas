#-----------------------------------------------------------------------------#
# Build using CUDA/ROCm docker images
#-----------------------------------------------------------------------------#

name: build-docker
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-docker-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}-${{github.workflow}}
  cancel-in-progress: true

jobs:
  # TODO: since we don't build on GPU systems with cuda/rocm docker,
  # none of the tests actually run on device
  gpu:
    name: >-
      ${{format('{0}{1}{2}-{3}-{4}',
                matrix.special,
                matrix.special && '-' || '',
                matrix.geometry,
                matrix.buildtype,
                matrix.image)}}
    strategy:
      fail-fast: false
      matrix:
        geometry: ["orange", "vecgeom"]
        buildtype: ["debug", "ndebug"]
        image: ["rocky-cuda", "ubuntu-rocm"]
        exclude:
          - geometry: "vecgeom"
            buildtype: "debug" # Build is too large
          - geometry: "vecgeom"
            image: "ubuntu-rocm" # VecGeom not installed on HIP
          - buildtype: "debug"
            image: "ubuntu-rocm" # Debug device code breaks HIP optimizer

    env:
      CELER_DISABLE_DEVICE: 1 # REQUIRED for GHA runners
      CELER_CMAKE_PRESET: >-
        ${{format('{0}-{1}',
                matrix.buildtype,
                matrix.geometry)}}
    runs-on: ubuntu-24.04
    container:
      image: >-
        docker.io/celeritas/${{
             matrix.image == 'rocky-cuda' && 'ci-rocky-cuda12:2024-12-29'
          || matrix.image == 'ubuntu-rocm' && 'ci-ubuntu-rocm7:2025-11-04'
        }}
    steps:
      - name: Set up environment
        run: |
          . /etc/profile
          echo "/opt/view/bin" >> $GITHUB_PATH
          echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}" >> $GITHUB_ENV
      # NOTE: checkout must occur *after* setting up environment for git tags to work
      # NOTE: depth must be enough to include the previous tag
      - name: Check out Celeritas
        uses: actions/checkout@v6
        with:
          fetch-depth: 383
          fetch-tags: true

      # TODO: fix when we update docker images
      - name: Update git config to allow running as root
        run: |
          git config --global --add safe.directory ${PWD}

      - name: Configure Celeritas
        uses: ./.github/actions/configure
        with:
          preset: ${{env.CELER_CMAKE_PRESET}}
          presets-file: ci-${{matrix.image}}.json

      - name: Build Celeritas
        id: build
        working-directory: build
        run: |
          echo "::group::Build verbosely"
          ninja -v -k0
          echo "::endgroup::"
          # echo "::notice title=build-size::Build size is $(du -hs . | awk '{print $1}')"

      - name: Test Celeritas
        id: test
        uses: ./.github/actions/run-ctest
        with:
          name: ${{matrix.image}}-${{env.CELER_CMAKE_PRESET}}

      - name: Install
        id: install
        uses: ./.github/actions/install-and-check
        if: ${{!cancelled() && steps.build.outputs.build-outcome == 'success'}}
        with:
          binaries: orange-update celer-export-geant celer-sim celer-g4

      - name: Build examples
        # TODO: rocm+ndebug fails to propagate HIP library link
        if: >-
          ${{
            steps.install.outcome == 'success'
            && !(matrix.image == 'ubuntu-rocm' && matrix.buildtype == 'ndebug')
          }}
        run: |
          . /etc/profile
          # Get Geant4 version number for use by script
          export G4VERSION_NUMBER=$(
            grep -E '^\s*#define\s+G4VERSION_NUMBER' \
              /opt/view/include/Geant4/G4Version.hh \
              | awk '{print $3}'
          )
          ./scripts/ci/test-examples.sh

