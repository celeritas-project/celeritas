#-----------------------------------------------------------------------------#
# Post test results after a pull request
#
# NOTE: this workflow runs on the *develop* branch of the main repository
# after an incoming pull request is run. Changes to this script *will not*
# affect a PR and must first be tested on the develop branch of a fork.
#-----------------------------------------------------------------------------#

name: pull_request_completed

on:
  workflow_run:
    workflows: ["pull_request"]
    types:
      - completed

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write

jobs:
  report-tests:
    runs-on: ubuntu-24.04
    env:
      ARTIFACTS_DIR: artifacts
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, 11 Mar 2026
        with:
          # See:
          # - pull_request: jobs.metadata.steps.upload
          # - run-ctest: runs.steps.upload
          # Syntax: https://www.gnu.org/software/bash/manual/html_node/Pattern-Matching.html
          pattern: "+(event-file|test-results-*)"
          merge-multiple: false
          github-token: ${{secrets.GITHUB_TOKEN}}
          run-id: ${{github.event.workflow_run.id}}
          path: ${{env.ARTIFACTS_DIR}}
      - name: Publish PR comment
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0, 15 June 2026
        if: ${{!cancelled()}}
        with:
          check_name: "Test summary"
          commit: ${{github.event.workflow_run.head_sha}}
          event_file: ${{env.ARTIFACTS_DIR}}/event-file/event.json
          event_name: ${{github.event.workflow_run.event}}
          files: "${{env.ARTIFACTS_DIR}}/**/*.xml"
      - name: Publish comments on source code
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2, 20 June 2026
        if: ${{!cancelled()}}
        with:
          commit: ${{github.event.workflow_run.head_sha}}
          report_paths: "${{env.ARTIFACTS_DIR}}/**/*.xml"

  report-regression:
    runs-on: ubuntu-24.04
    env:
      ARTIFACTS_DIR: artifacts
    steps:
      - name: Check out Celeritas
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, 11 Mar 2026
        with:
          pattern: "+(event-file|regression-results-*|test-results-regression-*)"
          merge-multiple: false
          github-token: ${{secrets.GITHUB_TOKEN}}
          run-id: ${{github.event.workflow_run.id}}
          path: ${{env.ARTIFACTS_DIR}}
      - name: Extract pull request info
        id: pr-info
        # event.json is the original 'pull_request' event payload, needed since
        # workflow_run's pull_requests list is empty for PRs from forks
        run: |
          echo "number=$(jq -r '.pull_request.number' "$ARTIFACTS_DIR/event-file/event.json")" >> "$GITHUB_OUTPUT"
      # NOTE: no 'ref' override -- this checks out the trusted base branch (see NOTE at top of
      # file), since everything run below (this action, scripts/ci/*.py) must never come from the
      # PR being tested. See .github/actions/process-regression/action.yml for details.
      - name: Process regression results
        if: ${{!cancelled()}}
        uses: ./.github/actions/process-regression
        with:
          pr-number: ${{steps.pr-info.outputs.number}}
          artifacts-dir: ${{env.ARTIFACTS_DIR}}
          actions-run-url: ${{github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}
          github-token: ${{secrets.GITHUB_TOKEN}}

