name: build-spack
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}-${{github.workflow}}
  cancel-in-progress: true

jobs:
  spack:
    name: reldeb-orange-asanlite
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: "reldeb"
            geometry: "orange"
            special: "asanlite"
    env:
      CMAKE_PRESET: reldeb-orange-asanlite
      CC: "clang-18"
      CXX: "clang++-18"
    runs-on: ubuntu-24.04
    continue-on-error: false
    steps:
      - name: Set up Spack environment
        uses: ./.github/actions/spack-setup
        with:
          geometry: orange
          cxxstd: 20
          add-root: false

      - name: Configure Celeritas
        id: configure
        uses: ./.github/actions/configure
        with:
          preset: ${{env.CMAKE_PRESET}}
          presets-file: "ci-ubuntu-github.json"

      - name: Build all
        id: build
        uses: ./.github/actions/ccache-build
        with:
          preset: ${{env.CMAKE_PRESET}}
          key: ccache-${{env.CMAKE_PRESET}}-${{matrix.geant}}
          ccache-max-size: ${{matrix.build_type == 'reldeb' && '500' || '300'}}Mi

      - name: Run tests
        id: test
        uses: ./.github/actions/run-ctest
        with:
          split-app: true
          artifact-name: test-results-spack-${{env.CMAKE_PRESET}}
          strict: false

      - name: Install
        id: install
        uses: ./.github/actions/install-and-check

