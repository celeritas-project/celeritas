#-----------------------------------------------------------------------------#
# Run tests on push to develop/backport branches.
#-----------------------------------------------------------------------------#

name: push
# Run name renders as `{branch}: {head commit subject}`
run-name: >-
  ${{github.ref_name}}: ${{github.event.head_commit.message}}

on:
  push:
    branches:
      - develop
      - backports/**

concurrency:
  group: push-${{github.ref_name}}-${{github.run_number}}
  cancel-in-progress: true

jobs:
  build-ultralite:
    uses: ./.github/workflows/build-ultralite.yml
  build-fast:
    uses: ./.github/workflows/build-fast.yml
  build-docker:
    uses: ./.github/workflows/build-docker.yml
  build-spack:
    uses: ./.github/workflows/build-spack.yml
  build-spack-extra:
    uses: ./.github/workflows/build-spack-extra.yml
  build-codecov:
    uses: ./.github/workflows/build-codecov.yml
    secrets: inherit

