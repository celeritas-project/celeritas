#-----------------------------------------------------------------------------#
# Run a series of progressively expensive checks on each pull request
#-----------------------------------------------------------------------------#

name: pull_request
# Run name renders as `#{PR number}: {PR title}`
run-name: >-
  #${{github.event.number}}: ${{github.event.pull_request.title}}

on:
  pull_request:
    branches:
      - develop
      - backports/**
    paths-ignore:
      - "**.rst"
      - "**.md"
      - "scripts"
      - ".jenkins"
      - "!scripts/cmake-presets/ci*"
      - "!scripts/ci"
      - "!scripts/build.sh"

# Only allow one PR action per PR, and cancel old ones when a new one (e.g. new commit)
# is triggered
concurrency:
  group: pr-${{github.event.number}}
  cancel-in-progress: true

jobs:
  metadata:
    name: "Save job metadata"
    runs-on: ubuntu-24.04
    steps:
      # Event file is needed for pull_request_completed to provide the fork's context
      - name: Upload event file
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: event-file
          path: ${{github.event_path}}
          if-no-files-found: error
          retention-days: 1
  build-spack:
    uses: ./.github/workflows/build-spack.yml
  build-regression:
    uses: ./.github/workflows/build-regression.yml

