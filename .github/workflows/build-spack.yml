#-----------------------------------------------------------------------------#
# Build directly on the GitHub runner with caching
#
# NOTE: the 'tidy' and 'codecov' special cases live in build-spack-tidy.yml and
# build-spack-codecov.yml, since their post-build steps diverge significantly from
# the rest of the matrix.
#-----------------------------------------------------------------------------#

name: build-spack
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}-${{github.workflow}}
  cancel-in-progress: true

jobs:
  spack:
    name: >-
      ${{format('{0}{1}{2}{3}{4}',
                matrix.special,
                matrix.special && '-' || '',
                matrix.geometry,
                matrix.geant && '-g4@' || '',
                matrix.geant)}}
    strategy:
      fail-fast: false
      matrix:
        build_type: ["reldeb"]
        geometry: ["vecgeom"]
        special: [""]
        geant: ["10.5", "10.6", "10.7", "11.0", "11.1", "11.2", "11.3"]
        include:
          - build_type: "reldeb"
            geometry: "orange"
            special: "minimal"
            geant: ""
          - build_type: "reldeb"
            geometry: "orange"
            special: "float"
            geant: "11.3"
          - build_type: "ndebug"
            geometry: "orange"
            special: "static"
            geant: "11.3"
          - build_type: "reldeb"
            geometry: "orange"
            special: "asanlite"
            geant: ""
          - build_type: "reldeb"
            geometry: "vecgeom"
            special: "clhep"
            geant: "11.3"
          - build_type: "reldeb"
            geometry: "vecgeom2"
            special: ""
            geant: "11.3"
          - build_type: "reldeb"
            geometry: "geant4"
            special: ""
            geant: "11.3"
    env:
      CCACHE_DIR: "${{github.workspace}}/.ccache"
      CCACHE_MAXSIZE: "${{matrix.build_type == 'reldeb' && '500' || '300'}}Mi"
      CMAKE_PRESET: >-
        ${{format('{0}-{1}{2}{3}',
                  matrix.build_type,
                  matrix.geometry,
                  matrix.special && '-' || '',
                  matrix.special)}}
      CC: "clang-18"
      CXX: "clang++-18"
      CXXSTD: ${{(matrix.geant == '10.5' || matrix.geant == '10.6')
                 && 17 || 20}}
    runs-on: ubuntu-24.04
    continue-on-error: false
    steps:
      - name: Set up Spack environment
        uses: ./.github/actions/spack-setup
        with:
          geometry: ${{matrix.geometry}}
          geant: ${{matrix.geant}}
          cxxstd: ${{env.CXXSTD}}
          add-root: >-
            ${{(matrix.special != 'minimal'
                && matrix.special != 'asanlite'
                && matrix.special != 'static'
                && env.CXXSTD == '20')
               && 'true' || 'false'}}
      - name: Verify Geant4 environment override
        if: ${{matrix.geant == '11.0'}}
        run: |
          # Test overriding of Geant4 environment variables
          . ${SPACK_VIEW}/rc
          test -n "${G4LEDATA}"

      ### BUILD ###

      - name: Configure Celeritas
        uses: ./.github/actions/configure
        with:
          preset: ${{env.CMAKE_PRESET}}
          presets-file: 'ci-ubuntu-github.json'

      - name: Restore ccache
        uses: ./.github/actions/ccache-restore
        with:
          path: ${{env.CCACHE_DIR}}
          key: ccache-${{env.CMAKE_PRESET}}-${{matrix.geant}}-${{github.run_id}}
          restore-keys: |
            ccache-${{env.CMAKE_PRESET}}-${{matrix.geant}}
      - name: Build all
        id: build
        working-directory: build
        run: |
          ccache -z
          echo "::group::Build verbosely"
          ninja -v -k0
          echo "::endgroup::"
          # echo "::notice title=build-size::Build size is $(du -hs . | awk '{print $1}')"
      - name: Show ccache stats
        if: ${{!cancelled()}}
        run: |
          ccache -s
      - name: Save ccache
        uses: ./.github/actions/ccache-save
        with:
          path: ${{env.CCACHE_DIR}}
          key: ccache-${{env.CMAKE_PRESET}}-${{matrix.geant}}-${{github.run_id}}
          build-outcome: ${{steps.build.outcome}}

      ### TEST ###

      - name: Regenerate ROOT test data
        if: >-
          ${{
            matrix.geant == '11.3'
            && matrix.special != 'minimal'
            && matrix.special != 'static'
          }}
        working-directory: build
        run: |
          ninja -v -k0 update-root-test-data
      - name: Set test strictness
        # Note this is ignored for non-primary geometry implementations
        if: ${{matrix.geant == '11.3' && matrix.geometry != 'vecgeom2'}}
        run: echo "CELER_TEST_STRICT=1" >> "$GITHUB_ENV"
      - name: Run unit tests
        id: unittest
        if: ${{matrix.special != 'static'}}
        uses: ./.github/actions/run-ctest
        with:
          preset: spack-unit
          artifact-name: test-results-spack-${{env.CMAKE_PRESET}}-${{matrix.geant}}
          extra-args: >-
            ${{matrix.geant && fromJSON(matrix.geant) < 11
                && '-R "^accel/"' || ''}}
      - name: Run app tests
        id: apptest
        if: >-
          ${{
            !cancelled()
            && steps.build.outcome == 'success'
          }}
        run: |
          ctest --preset=spack-app

      ### INSTALL ###

      - name: Check using build directory as install
        # TODO: ASAN requires flags downstream
        if: >-
          ${{
            !cancelled()
            && steps.build.outcome == 'success'
            && matrix.special != 'asanlite'
          }}
        env:
          CELER_DISABLE_G4_EXAMPLES: 1 # Only run minimal example
        run: |
          . ${SPACK_VIEW}/rc
          CELER_INSTALL_DIR=${PWD}/build ./scripts/ci/test-examples.sh
      - name: Install and check
        id: install
        if: ${{!cancelled() && steps.build.outcome == 'success'}}
        uses: ./.github/actions/install-and-check
        with:
          binaries: orange-update celer-geo celer-export-geant celer-sim celer-g4
      - name: Build examples
        env:
          CELER_DISABLE_G4_EXAMPLES: ${{(!matrix.geant) && '1' || ''}}
        # `asanlite` requires downstream flags that don't propagate
        if: >-
          ${{
            steps.install.outcome == 'success'
            && matrix.special != 'asanlite'
          }}
        run: |
          . ${SPACK_VIEW}/rc
          export G4VERSION_NUMBER=$(echo "${{matrix.geant}}" | awk '{printf "%.0f", $1 * 100}')
          ./scripts/ci/test-examples.sh

