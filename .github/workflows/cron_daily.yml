name: cron_daily

on:
  schedule:
    - cron: "33 07 * * *" # Daily at 07:33 UTC

permissions:
  contents: read

jobs:
  build-vecgeom-master:
    if: github.repository == 'celeritas-project/celeritas'
    uses: ./.github/workflows/build-vecgeom-master.yml

