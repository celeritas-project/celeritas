# Check compatibility with upstream dependencies every day
#-----------------------------------------------------------------------------#

name: cron_daily

on:
  schedule:
    - cron: "33 07 * * *" # Daily at 07:33 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  clear-pr-cache:
    if: ${{ vars.CELER_CI || github.event_name == 'workflow_dispatch' }}
    permissions:
      actions: write
    uses: ./.github/workflows/clear-cache.yml
    with:
      ref: "^refs/pull/"
      age: 2
  build-vecgeom-master:
    # This variable should always be set for celeritas-project, but can also
    # be set by your fork if desired
    if: ${{ vars.CELER_CI || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/build-vecgeom-master.yml

