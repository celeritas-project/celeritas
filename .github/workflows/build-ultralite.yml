#-----------------------------------------------------------------------------#
# Build Celeritas with minimal dependencies using only local packages
#-----------------------------------------------------------------------------#

name: build-ultralite
on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: build-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}-${{github.workflow}}
  cancel-in-progress: true

jobs:
  linux:
    name: ultralite-ubuntu
    env:
      CELER_CMAKE_PRESET: ultralite
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Celeritas
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get -q -y update
          sudo apt-get -q -y install \
            ccache nlohmann-json3-dev libpng-dev

      - name: Configure
        uses: ./.github/actions/configure
        with:
          preset: ${{env.CELER_CMAKE_PRESET}}
          presets-file: ci-ubuntu-github.json
          version-string: >-
            ${{
              github.event.pull_request
              && format('-pr.{0}', github.event.pull_request.number)
              || format('-{0}', github.ref_name)
            }}

      - name: Build
        id: build
        uses: ./.github/actions/ccache-build
        with:
          preset: ${{env.CELER_CMAKE_PRESET}}
          name: ultralite-ubuntu
          ccache-max-size: 100Mi
          ccache-debug: true

      - name: Test
        id: test
        uses: ./.github/actions/run-ctest
        with:
          preset: ${{env.CELER_CMAKE_PRESET}}
          name: ultralite-ubuntu

      - name: Install
        uses: ./.github/actions/install-and-check
        with:
          clean-build: "false"

  windows:
    name: ultralite-windows
    env:
      CELER_CMAKE_PRESET: ultralite
    runs-on: windows-latest
    steps:
      - name: Check out Celeritas
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          choco install ninja ccache
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        uses: ./.github/actions/configure
        with:
          preset: ${{env.CELER_CMAKE_PRESET}}
          presets-file: ci-windows-github.json
          version-string: >-
            ${{
              github.event.pull_request
              && format('-pr.{0}', github.event.pull_request.number)
              || format('-{0}', github.ref_name)
            }}
      - name: Build
        id: build
        uses: ./.github/actions/ccache-build
        with:
          preset: ${{env.CELER_CMAKE_PRESET}}
          name: ultralite-windows
          ccache-max-size: 50Mi

      - name: Test
        id: test
        uses: ./.github/actions/run-ctest
        with:
          preset: ${{env.CELER_CMAKE_PRESET}}
          name: ultralite-windows

      - name: Install
        uses: ./.github/actions/install-and-check
        with:
          clean-build: "false"

