#-----------------------------------------------------------------------------#
# Build Celeritas with minimal dependencies using only local packages
#-----------------------------------------------------------------------------#

name: build-ultralite
on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: build-ultralite-${{github.event.number || github.ref_name}}
  cancel-in-progress: true

env:
  CELER_CMAKE_PRESET: ultralite
  CXXSTD: 17
  CELER_VERSION_STRING: >-
    ${{
      github.event.pull_request
      && format('-pr.{0}', github.event.pull_request.number)
      || format('-{0}', github.ref_name)
    }}

jobs:
  ultralite:
    name: ultralite-${{matrix.platform}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu
          - platform: windows
    runs-on: >-
      ${{  matrix.platform == 'ubuntu' && 'ubuntu-24.04'
        || matrix.platform == 'windows' && 'windows-2025'
      }}
    steps:
      - name: Check out Celeritas
        uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu)
        if: ${{matrix.platform == 'ubuntu'}}
        run: |
          sudo apt-get -q -y update
          sudo apt-get -q -y install \
            ccache nlohmann-json3-dev libpng-dev
      - name: Install dependencies (Windows)
        if: ${{matrix.platform == 'windows'}}
        run: |
          choco install ninja ccache
      - name: Set up MSVC
        if: ${{matrix.platform == 'windows'}}
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0, 22 July 2026
        with:
          arch: x64

      - name: Configure
        uses: ./.github/actions/configure
        with:
          preset: ${{env.CELER_CMAKE_PRESET}}
          presets-file: ci-${{matrix.platform}}-github.json
          version-string: ${{env.CELER_VERSION_STRING}}

      - name: Build
        id: build
        uses: ./.github/actions/build-cached
        with:
          name: ultralite-${{matrix.platform}}
          preset: ${{env.CELER_CMAKE_PRESET}}
          ccache-max-size: 128Mi
          ccache-debug: ${{matrix.platform == 'ubuntu' && '1' || '0'}}

      - name: Test
        id: test
        uses: ./.github/actions/run-ctest
        with:
          name: ultralite-${{matrix.platform}}
          preset: ${{env.CELER_CMAKE_PRESET}}

      - name: Install
        uses: ./.github/actions/install-and-check
        with:
          clean-build: "false"

