#-----------------------------------------------------------------------------#
# Build and upload code coverage
#-----------------------------------------------------------------------------#

name: build-codecov
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      # The codecov token is only used when pushing to protected branches
      # (main/develop), since secrets are *not* passed from the main
      # celeritas project to the PR run on the fork.
      CODECOV_TOKEN:
        required: false

concurrency:
  group: build-codecov-${{github.event.number || github.ref_name}}
  cancel-in-progress: true

jobs:
  spack:
    name: spack-vecgeom
    env:
      CELER_CMAKE_PRESET: vecgeom-codecov
      LLVM_COV: "llvm-cov-18"
      CC: "clang-18"
      CXX: "clang++-18"
      CXXSTD: 20
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Celeritas
        uses: actions/checkout@v7
      - name: Set up Spack environment
        uses: ./.github/actions/setup-spack
        with:
          add: vecgeom@2.2.0 geant4@11.3 g4vg root py-gcovr
          cxxstd: ${{env.CXXSTD}}
      - name: Configure Celeritas
        uses: ./.github/actions/configure
        with:
          preset: ${{env.CELER_CMAKE_PRESET}}
          presets-file: "ci-ubuntu-github.json"
      - name: Build all
        id: build
        uses: ./.github/actions/build-cached
        with:
          name: spack-${{env.CELER_CMAKE_PRESET}}
          preset: spack
          ccache-max-size: 512Mi
          no-save: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/develop') }}
      - name: Check debug is disabled
        working-directory: build
        run: |
          test $(./bin/celer-config | jq .config.debug) == "false"
      - name: Run tests
        id: test
        uses: ./.github/actions/run-ctest
        with:
          name: spack-${{env.CELER_CMAKE_PRESET}}
          preset: spack-codecov
          split-app: true
      - name: Generate and upload coverage report
        if: ${{ !cancelled() && steps.build.outputs.outcome == 'success' }}
        uses: ./.github/actions/process-coverage
        with:
          name: spack-${{env.CELER_CMAKE_PRESET}}
          token: ${{secrets.CODECOV_TOKEN}}
          gcov-exe: "${{github.workspace}}/scripts/ci/llvm-gcov.sh"

