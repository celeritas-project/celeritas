#-----------------------------------------------------------------------------#
# Clear GitHub Actions caches on demand.
# See https://docs.github.com/en/rest/actions/cache
#-----------------------------------------------------------------------------#

name: clear-cache
on:
  workflow_dispatch:
    inputs:
      initial_delay:
        description: "Initial backoff delay in seconds"
        required: false
        default: 30
        type: number
      max_retries:
        description: "Maximum number of retries per cache entry"
        required: false
        default: 5
        type: number
      key:
        description: "Regular expression for cache keys to delete"
        required: false
        default: "^ccache-"
        type: string
      ref:
        description: "Regular expression for refs to delete caches from"
        required: false
        default: ".*"
        type: string
      age:
        description: "Minimum cache age in days"
        required: false
        default: 0
        type: number
  workflow_call:
    inputs:
      initial_delay:
        description: "Initial backoff delay in seconds"
        required: false
        default: 30
        type: number
      max_retries:
        description: "Maximum number of retries per cache entry"
        required: false
        default: 5
        type: number
      key:
        description: "Regular expression for cache keys to delete"
        required: false
        default: "^ccache-"
        type: string
      ref:
        description: "Regular expression for refs to delete caches from"
        required: false
        default: ".*"
        type: string
      age:
        description: "Minimum cache age in days"
        required: false
        default: 0
        type: number

permissions:
  actions: write

jobs:
  clear-cache:
    runs-on: ubuntu-24.04
    steps:
      - name: Clear ccache
        uses: actions/github-script@v9
        env:
          INITIAL_DELAY: ${{ inputs.initial_delay }}
          MAX_RETRIES: ${{ inputs.max_retries }}
          KEY: ${{ inputs.key }}
          REF: ${{ inputs.ref }}
          AGE: ${{ inputs.age }}
        with:
          script: |
            // Get configuration from inputs
            const delayMs = parseInt(process.env.INITIAL_DELAY) * 1000; // seconds to milliseconds
            const maxRetries = parseInt(process.env.MAX_RETRIES);
            const ageDays = Number(process.env.AGE);
            const keyFilter = new RegExp(process.env.KEY);
            const refFilter = new RegExp(process.env.REF);

            if (!Number.isInteger(delayMs) || delayMs <= 0) {
              throw new Error(`INITIAL_DELAY must be a positive integer, got: ${process.env.INITIAL_DELAY ?? 'undefined'}`);
            }
            if (!Number.isInteger(maxRetries) || maxRetries <= 0) {
              throw new Error(`MAX_RETRIES must be a positive integer, got: ${process.env.MAX_RETRIES ?? 'undefined'}`);
            }
            if (!Number.isInteger(ageDays) || ageDays < 0) {
              throw new Error(`AGE must be a nonnegative integer, got: ${process.env.AGE ?? 'undefined'}`);
            }

            console.log(`Configuration: initial delay ${delayMs / 1000}s, max retries ${maxRetries}, minimum age ${ageDays}d`);
            core.debug(`Cache filters: key ${keyFilter}, ref ${refFilter}`);

            class CacheDeleter {
              constructor(delay, maxRetries) {
                this.backoffUntil = 0;
                this.delay = delay;
                this.maxRetries = maxRetries;
              }

              async waitForBackoff(cache) {
                const waitTime = this.backoffUntil - Date.now();
                if (waitTime > 0) {
                  core.debug(`Waiting ${waitTime / 1000} seconds before deleting ${cache.key}...`);
                  await new Promise(resolve => setTimeout(resolve, waitTime));
                }
              }

              handleError(error, cache, attempt) {
                if (!error.message?.includes("wait a few minutes")) {
                  core.setFailed(`Failed to delete cache ${cache.key}: ${error}`);
                  return "fail";
                }

                // Rate limits delay subsequent deletions as well as retries.
                core.warning(`Rate limit hit for ${cache.key}; backing off for ${this.delay / 1000} seconds.`);
                this.backoffUntil = Date.now() + this.delay;
                this.delay *= 2;
                if (attempt === this.maxRetries) {
                  core.setFailed(`Max retries (${this.maxRetries}) reached for cache ${cache.key}`);
                  return "abort";
                }
                return "retry";
              }

              async deleteAttempt(cache, attempt) {
                core.debug(`Deleting cache entry ${cache.key} (attempt ${attempt})`);
                try {
                  await github.rest.actions.deleteActionsCacheById({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    cache_id: cache.id,
                  });
                } catch (error) {
                  return this.handleError(error, cache, attempt);
                }
                return "deleted";
              }

              async delete(cache) {
                for (let attempt = 1; attempt <= this.maxRetries; attempt++) {
                  await this.waitForBackoff(cache);
                  const result = await this.deleteAttempt(cache, attempt);
                  core.debug(`${cache.key} -> ${result}`)
                  if (result !== "retry") {
                    return result;
                  }
                }
              }
            }

            const deleter = new CacheDeleter(delayMs, maxRetries);

            console.log("Getting action cache")
            const parameters = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
              direction: "asc",
              sort: "created_at",
            }
            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              parameters,
              (response) => response.data,
            )
            const cutoff = Date.now() - ageDays * 24 * 60 * 60 * 1000;
            const counters = { total: 0, matched: 0 };
            for (const cache of caches) {
              if (keyFilter.test(cache.key) && refFilter.test(cache.ref) && Date.parse(cache.created_at) <= cutoff) {
                const result = await deleter.delete(cache);
                ++counters.matched;
                counters[result] = (counters[result] ?? 0) + 1;
              }
              ++counters.total;
            }

            core.notice(`Cache results: ${JSON.stringify(counters)}`)

# vim: set nowrap tw=100:
