name: Check dd4hep integration

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - feature-dd4hep-integration-plugin

concurrency:
  group: build-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}-${{github.workflow}}
  cancel-in-progress: true

jobs:
  check-dd4hep-integration:
    container: ghcr.io/eic/eic_ci:nightly
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v5
      - name: Configure
        run: |
          source /etc/profile
          eic-info
          cmake -DCELERITAS_USE_DD4hep=ON -DCMAKE_INSTALL_PREFIX=install -S . -B build
      - name: Build and install
        id: build
        working-directory: build
        run: |
          source /etc/profile
          cmake --build -j 8 .
          cmake --install .

      - name: Run example
        working-directory: example/ddceler
        run: |
          set +e
          set -o pipefail
          source /etc/profile
          # Run both simulations in parallel with separate log files
          echo "Starting Celeritas simulation..."
          ./run-example.sh \
            --outputFile output_celeritas.root \
            > celeritas.log 2>&1 &
          CELER_PID=$!

          echo "Starting Geant4 simulation..."
          CELER_DISABLE=1 \
          ./run-example.sh \
            --outputFile output_geant4.root \
            > geant4.log 2>&1 &
          GEANT4_PID=$!

          # Wait for both to complete
          wait $CELER_PID || CELER_EXIT=$?
          wait $GEANT4_PID || GEANT4_EXIT=$?

          # Display logs
          echo "=== Celeritas Log ==="
          cat celeritas.log
          echo "=== Geant4 Log ==="
          cat geant4.log

          # Check exit codes
          if [ "${CELER_EXIT:-0}" -ne 0 ] || [ "${GEANT4_EXIT:-0}" -ne 0 ]; then
            echo "Error: One or more simulations failed"
            exit 1
          fi

      - name: Compare results
        working-directory: example/ddceler
        run: |
          source /etc/profile
          cmake -S . -B build
          cmake --build -j 8 build
          ./build/ddceler-compare \
            $PWD/output_geant4.root \
            $PWD/output_celeritas.root
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
          ${{
            !cancelled()
            && steps.build.outcome == 'success'
          }}
        with:
          name: simulation-artifacts
          path: |
            example/ddceler/*.log
            example/ddceler/*.root
            example/ddceler/*.gdml
            example/ddceler/*.png
