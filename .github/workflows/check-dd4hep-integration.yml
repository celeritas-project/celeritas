name: Check dd4hep integration

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - feature-dd4hep-integration-plugin

concurrency:
  group: build-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}-${{github.workflow}}
  cancel-in-progress: true

jobs:
  check-dd4hep-integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: cvmfs-contrib/github-action-cvmfs@v5
    - uses: eic/run-cvmfs-osg-eic-shell@main
      with:
        platform-release: "eic_xl:nightly"
        network_types: "none"
        run: |
          eic-info
          cmake -DCMAKE_BUILD_TYPE=Debug -DCELERITAS_USE_DD4hep=ON -DCMAKE_INSTALL_PREFIX=install -S . -B build
          cmake --build build -j 8
          cmake --install build
          export LD_LIBRARY_PATH=$PWD/install/lib:${LD_LIBRARY_PATH}

          CELER_LOG=debug CELER_LOG_LOCAL=debug ddsim --action.run DDcelerRunAction --compactFile=$DD4hepINSTALL/DDDetectors/compact/SiD.xml --steering steeringFile.py -N 20 -G --gun.particle e- --gun.etaMax 4 --gun.etaMin 1 --gun.energy 5*GeV --gun.distribution uniform --outputFile output.root --outputConfig.forceDD4HEP  --action.tracker "Geant4TrackerAction" --action.trackerSDTypes "tracker" --action.calorimeter "Geant4CalorimeterAction" --action.calorimeterSDTypes "calorimeter"
          
