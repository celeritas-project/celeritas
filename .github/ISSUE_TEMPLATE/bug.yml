#-----------------------------------------------------------------------------#
# Bug report form; authorship label applied by issues_opened
#-----------------------------------------------------------------------------#

name: Bug report
description: Report a bug 🐞
type: Bug
body:
  - type: dropdown
    id: authorship
    attributes:
      label: Authorship
      description: How was this issue developed and submitted?
      options:
        - Manually
        - Assisted by AI
        - Generated by AI
    validations:
      required: true
  - type: textarea
    id: celer-config
    attributes:
      label: Celeritas configuration
      description: >-
        Paste the JSON output of `celer-config`.
      render: json
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug, how to reproduce it, and what you expected.
    validations:
      required: true
