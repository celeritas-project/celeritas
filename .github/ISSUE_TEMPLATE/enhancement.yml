#-----------------------------------------------------------------------------#
# Enhancement request form; authorship label applied by issues_opened
#-----------------------------------------------------------------------------#

name: Enhancement
description: Request a feature or improvement ✨
type: Enhancement
body:
  - type: dropdown
    id: authorship
    attributes:
      label: Authorship
      description: How was this issue developed and submitted?
      options:
        - Manually
        - Assisted by AI
        - Generated by AI
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the proposed feature or improvement and its motivation.
    validations:
      required: true
