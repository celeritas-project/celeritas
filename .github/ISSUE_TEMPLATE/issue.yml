#-----------------------------------------------------------------------------#
# Issue form; labels are applied by the issues_opened workflow
#-----------------------------------------------------------------------------#

name: Issue
description: Report a bug, request a feature, or ask something else
body:
  - type: dropdown
    id: kind
    attributes:
      label: Issue type
      description: What kind of issue is this?
      options:
        - Bug
        - Feature request
        - Other
    validations:
      required: true
  - type: dropdown
    id: authorship
    attributes:
      label: Authorship
      description: How was this issue developed and/or written up?
      options:
        - Entirely human-written
        - Assisted by AI
        - Generated by AI
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug, feature request, or question in detail.
    validations:
      required: true
