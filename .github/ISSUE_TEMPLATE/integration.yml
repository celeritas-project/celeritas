#-----------------------------------------------------------------------------#
# Issue form for experiment integration; labels applied by issues_opened
#-----------------------------------------------------------------------------#

name: Experiment integration
description: Request or discuss integrating Celeritas with an experiment framework
title: "<experiment/framework/collaboration> integration"
labels: ["external"]
body:
  - type: dropdown
    id: authorship
    attributes:
      label: Authorship
      description: How was this issue developed and submitted?
      options:
        - Manually
        - Assisted by AI
        - Generated by AI
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: >-
        Describe the integration: version requirements (including CUDA/HIP),
        current workflow, and what you need from Celeritas.
    validations:
      required: true
