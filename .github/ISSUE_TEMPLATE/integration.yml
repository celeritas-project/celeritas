#-----------------------------------------------------------------------------#
# Issue form for experiment integration; labels applied by issues_opened
#-----------------------------------------------------------------------------#

name: Experiment integration
description: Request or discuss integrating Celeritas with an experiment framework
title: "Experiment integration: "
labels: ["external"]
body:
  - type: input
    id: experiment
    attributes:
      label: Experiment or framework
      description: Name of the experiment, collaboration, or software framework.
    validations:
      required: true
  - type: dropdown
    id: authorship
    attributes:
      label: Authorship
      description: How was this issue developed and/or written up?
      options:
        - Entirely human-written
        - Assisted by AI
        - Generated by AI
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: >-
        Describe the integration: versions, current workflow, and what you need
        from Celeritas.
    validations:
      required: true
