#-----------------------------------------------------------------------------#
# Task form; authorship label applied by issues_opened
#-----------------------------------------------------------------------------#

name: Task
description: Ask a question or describe other work
type: Task
body:
  - type: dropdown
    id: authorship
    attributes:
      label: Authorship
      description: How was this issue developed and submitted?
      options:
        - Manually
        - Assisted by AI
        - Generated by AI
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the task or question in detail.
    validations:
      required: true
